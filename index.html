<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Log</title>
    <style>
:root {
    --bg: #121212;
    --card: #1e1e1e;
    --input: #2a2a2a;
    --text: #e0e0e0;
    --dim: #b0b0b0;
    --blue: #3498db;
    --green: #2ecc71;
    --red: #ff4d4d;
    --purple: #9b59b6;
    --border-color: #333;
    --gold: #FFD700;
}
body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
}
h1, h2, h3 {
    color: #fff;
    text-align: center;
    margin-top: 0;
}
button {
    cursor: pointer;
    font-weight: bold;
    border: none;
}
button:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.6;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 13px;
}
th, td {
    border: 1px solid var(--border-color);
    padding: 6px;
    text-align: left;
}
.hidden {
    display: none !important;
}
select, button, input, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--input);
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
}
.flex-row, .timer-controls, .check-actions, .modal-badges, .calendar-header, .setup-label-flex, .input-color-label {
    display: flex;
    align-items: center;
}
.flex-row {
    gap: 10px;
    justify-content: center;
}
.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
}
.section-card {
    background: var(--card);
    padding: 15px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 20px;
}
.section-card-margin-top {
    margin-top: 20px;
}
.ex-block {
    background: rgba(155, 89, 182, 0.05);
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 6px;
    border-left: 5px solid var(--purple);
}
.routine-box {
    padding: 12px;
    border-radius: 6px;
    margin: 10px 0;
    text-align: left;
    display: flex;
    flex-direction: column;
}
.box-w {
    background: rgba(255, 77, 77, 0.08);
    border-left: 4px solid var(--red);
}
.box-c {
    background: rgba(52, 152, 219, 0.08);
    border-left: 4px solid var(--blue);
}
.timer-card {
    position: sticky;
    top: 10px;
    z-index: 100;
    max-width: 600px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    background: var(--bg);
    padding: 5px 10px;
    border-radius: 8px;
    margin-bottom: 20px;
}
#timeDisplay {
    font: bold 1.8em monospace;
    margin: 0;
    color: var(--gold);
}
.timer-controls {
    gap: 8px;
}
.timer-controls button, #metronomeToggleBtn {
    min-width: 44px;
    min-height: 44px;
    padding: 4px 8px;
    font-size: 14px;
    margin: 0;
    background-color: var(--bg);
    color: var(--gold);
    border: none;
}
.metronome-controls {
    border-left: 1px solid var(--border-color);
    padding-left: 15px;
}
.chk-item, .set-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
}
.chk-item > span, .set-row-main {
    flex-grow: 1;
    display: flex;
    align-items: center;
    gap: 6px;
}
.check-actions {
    gap: 4px;
    flex-shrink: 0;
}
.btn-act {
    min-width: 38px;
    min-height: 38px;
    padding: 4px 6px;
    font-size: 14px;
    border-radius: 4px;
    background: #333;
    color: #888;
    border: 1px solid #444;
}
.btn-comp.active {
    background: var(--green);
    color: #000;
    border-color: var(--green);
}
.btn-skip.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
}
.txt-comp, .txt-skip {
    text-decoration: line-through;
}
.txt-comp { color: var(--green); }
.txt-skip { color: var(--red); opacity: 0.5; }
.set-row { flex-wrap: nowrap; }
.set-row input {
    width: 50px;
    background: #333;
    text-align: center;
    font-weight: bold;
    padding: 8px 4px;
}
.set-row .weight-input { width: 75px; }
.chart-container {
    height: 240px;
    width: 100%;
    position: relative;
    margin-top: 15px;
    overflow: hidden;
}
.chart-container-small { height: 150px; margin-top: 10px; }
.svg-chart-container {
    display: block;
    width: 100%;
    background: #252525;
    border-radius: 4px;
}
.svg-chart-container .label { fill: var(--dim); font-size: 10px; }
.svg-chart-container .grid { stroke: var(--border-color); stroke-dasharray: 2,2; }
.svg-chart-container .tooltip { display: none; }
.svg-chart-container circle:hover + .tooltip, 
.svg-chart-container rect:hover + .tooltip { display: block; }
.history-card {
    background: #252525;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #333;
}
.chart-legend {
    font-size: 12px;
    color: var(--dim);
    text-align: center;
    margin-top: 10px;
}
#calendar-container {
    padding: 10px;
    background: #252525;
    border-radius: 8px;
}
.calendar-header {
    justify-content: space-between;
    margin-bottom: 15px;
}
.calendar-header button {
    width: 44px;
    height: 44px;
    margin: 0;
    padding: 0;
    background: #333;
    font-size: 18px;
}
#calendar-month-year {
    font-size: 1.2em;
    font-weight: bold;
}
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}
.calendar-day, .calendar-weekday {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 38px;
    border-radius: 50%;
}
.calendar-weekday {
    font-size: 0.8em;
    font-weight: bold;
    color: var(--dim);
}
.calendar-day {
    cursor: pointer;
    position: relative;
    font-size: 0.9em;
}
.calendar-day:hover { background: #444; }
.calendar-day.other-month { color: #555; cursor: default; }
.calendar-day.other-month:hover { background: transparent; }
.calendar-day.today { font-weight: bold; border: 1px solid var(--blue); }
.calendar-day.selected { background: var(--blue); color: #fff; }
.calendar-day .workout-dot {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    background: var(--purple);
    border-radius: 50%;
}
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: var(--card);
    padding: 20px 25px;
    border-radius: 12px;
    max-width: 90%;
    width: 360px;
    border: 1px solid var(--border-color);
    position: relative;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    max-height: 85vh;
    overflow-y: auto;
}
.modal-section { margin-bottom: 12px; }
.modal-section h4 {
    color: #fff;
    margin: 0 0 8px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
}
.modal-section p {
    font-size: 13px;
    margin: 0;
    color: var(--dim);
    line-height: 1.4;
}
.modal-section-p {
    color: var(--text) !important;
}
.how-to-text {
    font-size: 15px !important;
}
.modal-section p b {
    font-size: 11px;
    text-transform: uppercase;
    display: block;
    margin-top: 8px;
    color: #fff;
}
.modal-section p span {
    display: block;
    margin-left: 10px;
}
.close-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 40px;
    height: 40px;
    margin: 0;
    padding: 0;
    background: transparent;
    border: none;
    color: var(--dim);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1;
    border-radius: 50%;
    z-index: 10;
}
.close-btn:hover, .close-btn:active {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}
#toast-notification {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    z-index: 10000;
    font-size: 16px;
    font-weight: bold;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s, visibility 0.5s;
}
#toast-notification.show {
    opacity: 1;
    visibility: visible;
}
.setup-block {
    margin-bottom: 15px;
    background: rgba(0, 0, 0, 0.2);
    padding: 12px;
    border-radius: 6px;
}
.setup-block h4, .volume-header h3, .ex-block-header {
    margin: 0;
}
.ex-block-header { margin-bottom: 8px; }
.setup-toggle { cursor: pointer; padding: 10px 0; }
.setup-label-flex { gap: 10px; font-size: 12px; color: var(--dim); }
.flex-wrap-start {
    flex-wrap: wrap;
    gap: 15px;
    justify-content: flex-start;
}
.input-color-label { font-size:12px; gap:5px; color:var(--dim); }
.input-color-swatch { width:25px; height:25px; padding:0; border:none; }
.btn-add-day, .btn-save-config, .btn-factory-reset, .btn-import-export {
    min-height: 44px;
    margin-top: 10px;
}
.btn-add-day { background:#333; }
.btn-save-config { background:var(--purple); }
.btn-factory-reset { background:var(--red); }
.btn-import-export { background:#444; }
#date { width: 150px; }
#daySel { flex-grow: 1; }
.flex-row button { width: auto; padding: 8px 15px; margin: 0; }
.flex-row select, .flex-row input { margin: 0; }
.orm-header-badge { font-size: 12px; color: var(--gold); font-weight: bold; margin-left: 8px; }
#editMode { color:var(--gold); text-align:center; padding:10px; }
#editMode button { background:none; color:var(--gold); border:none; }
#saveSessionBtn { background:#27ae60; color:#f0f0f0; }
.volume-header { display:flex; justify-content:space-between; align-items:center; }
#rollAvgSel { width:auto; padding:4px 8px; margin:0; font-size:12px; background:#333; }
.input-bpm { width:80px; padding:4px 8px; margin:0; }
.ex-block-title { cursor:pointer; color:var(--purple); text-decoration:underline; font-size:16px; }
.ex-block-pr { float:right; font-size:11px; color:var(--gold); }
.btn-add-set { width:auto; padding: 4px 10px; font-size:12px; margin-top:5px; background:#333; }
.error-border { border: 1px solid var(--red) !important; }
    </style>
    <link rel="manifest" id="manifest-link">
    <meta name="theme-color" content="#1e1e1e">
    <link rel="icon" href="icon-512.png" type="image/png">
    <script>
        const manifest = {
            "name": "Fitness Log",
            "short_name": "FitnessLog",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#121212",
            "theme_color": "#1e1e1e",
            "description": "A single-file progressive web app for tracking workouts.",
            "icons": [
                { "src": "icon-512.png", "sizes": "512x512", "type": "image/png" },
                { "src": "icon-512-maskable.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.getElementById('manifest-link').href = manifestUrl;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swContent = `
                    const CACHE_NAME = 'fitness-log-cache-v1';
                    const urlsToCache = ['.', 'icon-512.png', 'icon-512-maskable.png'];
                    self.addEventListener('install', event => {
                        self.skipWaiting();
                        event.waitUntil(
                            caches.open(CACHE_NAME).then(cache => {
                                return cache.addAll(urlsToCache);
                            })
                        );
                    });
                    self.addEventListener('fetch', event => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            caches.match(event.request).then(response => {
                                if (response) {
                                    return response;
                                }
                                return fetch(event.request);
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swContent], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl)
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</head>
<body>
<div id="exModal" class="modal-overlay hidden" data-action="closeModal">
    <div class="modal-content">
        <button class="close-btn" aria-label="Close Modal" data-action="closeModal">&times;</button>
        <h2 id="modalTitle" class="modal-title-style">Exercise</h2>
        <div id="modal-extra-info"></div>
        <button data-action="jumpToProgress" class="btn-progress-chart">View Progress Chart</button>
    </div>
</div>
<div class="timer-card">
    <div class="flex-row">
        <div id="timeDisplay">00:00</div>
        <div class="timer-controls">
            <button data-action="addTime" data-time="60">+1m</button>
            <button data-action="resetTimer">Reset</button>
        </div>
    </div>
    <div class="flex-row metronome-controls">
        <button id="metronomeToggleBtn" data-action="toggleMetronome" aria-label="Toggle Metronome">&#x23F1;</button>
    </div>
</div>
<div class="container">
    <h1>Fitness Log</h1>
    <div class="section-card">
        <div id="editMode" class="hidden">&#x270F; EDIT MODE <button data-action="cancelEdit">Cancel</button></div>
        <div class="flex-row date-picker-row">
            <input type="date" id="date">
            <select id="daySel" data-action="loadDay"></select>
        </div>
        <div id="wBox" class="routine-box box-w"></div>
        <div id="form"></div>
        <div id="cBox" class="routine-box box-c"></div>
        <button id="saveSessionBtn" data-action="saveWorkoutSession">Save Session</button>
    </div>
    <div class="section-card">
        <h3 id="progressSection">Progress</h3>
        <select id="cxSel" data-action="updateCharts"></select>
        <div class="chart-legend">
            <span id="leg-orm" style="color:var(--gold);">&bull;</span> Est. 1RM (Strength) &nbsp;&nbsp;&nbsp; <span id="leg-exVol" style="color:#009688;">&bull;</span> Total Volume (Workload)
        </div>
        <div class="chart-container chart-container-small" id="exC-orm"></div>
        <div class="chart-container chart-container-small" id="exC-vol"></div>
    </div>
    <div class="section-card">
        <div class="volume-header">
            <h3>Volume</h3>
            <select id="rollAvgSel" data-action="updateCharts">
                <option value="2">2-Session</option>
                <option value="4" selected>4-Session</option>
                <option value="8">8-Session</option>
                <option value="16">16-Session</option>
            </select>
        </div>
        <div class="chart-legend">
            <span id="leg-dayVol" style="color:#FF7F50;">&bull;</span> Daily Volume &nbsp;&nbsp;&nbsp; <span id="leg-rollAvg" style="color:var(--gold);">&bull;</span> Rolling Avg
        </div>
        <div class="chart-container" id="volC"></div>
    </div>
    <div class="section-card"><h3>PRs</h3><div id="pb"></div></div>
    <h2>History</h2>
    <div id="calendar-container">
        <div class="calendar-header">
            <button data-action="prevMonth" aria-label="Previous Month">&#9668;</button>
            <div id="calendar-month-year"></div>
            <button data-action="nextMonth" aria-label="Next Month">&#9658;</button>
        </div>
        <div class="calendar-grid" id="calendar-weekdays"></div>
        <div class="calendar-grid" id="calendar-days"></div>
    </div>
    <div id="hist-detail"></div>
    <div class="section-card section-card-margin-top">
        <h3 data-action="toggleSetup" class="setup-toggle">&#x2699; Setup (Click to Expand)</h3>
        <div id="setup" class="hidden">
            <div class="setup-block">
                <h4>General</h4>
                <label class="setup-label-flex">
                    Metronome BPM:
                    <input type="number" id="setup-bpm" class="input-bpm" min="40" max="200">
                </label>
            </div>
            <div class="setup-block">
                <h4>Chart Colors</h4>
                <div class="flex-row flex-wrap-start">
                    <label class="input-color-label">1RM <input type="color" id="c-orm" class="input-color-swatch"></label>
                    <label class="input-color-label">Ex. Vol <input type="color" id="c-exVol" class="input-color-swatch"></label>
                    <label class="input-color-label">Daily Vol <input type="color" id="c-dayVol" class="input-color-swatch"></label>
                    <label class="input-color-label">Roll Avg <input type="color" id="c-rollAvg" class="input-color-swatch"></label>
                </div>
            </div>
            <div id="setupInputs"></div>
            <button data-action="addDayToSetup" class="btn-add-day">+ Add New Day</button>
            <button data-action="saveSetup" class="btn-save-config">Save Configuration</button>
            <button data-action="resetSetup" class="btn-factory-reset">Factory Reset</button>
        </div>
    </div>
    <div class="flex-row import-export-row">
        <button id="exportBtn" data-action="exportData" class="btn-import-export">&#x1F4E4; Export</button>
        <button id="importBtn" data-action="triggerImport" class="btn-import-export">&#x1F4E5; Import</button>
        <input type="file" id="imp" class="hidden" data-action="importData">
    </div>
</div>
<div id="toast-notification"></div>

    async function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_CONFIG.NAME, DB_CONFIG.VERSION);
            request.onerror = e => reject(new Error(`DB Error: ${e.target.errorCode}`));
            request.onsuccess = e => resolve(e.target.result);
            request.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_CONFIG.STORES.SESSIONS)) {
                    db.createObjectStore(DB_CONFIG.STORES.SESSIONS, { keyPath: 'rd' });
                }
                if (!db.objectStoreNames.contains(DB_CONFIG.STORES.CONFIG)) {
                    db.createObjectStore(DB_CONFIG.STORES.CONFIG, { keyPath: 'id' });
                }
            };
        });
    }
    function dbGet(storeName, key) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readonly'); tx.objectStore(storeName).get(key).onsuccess = e => resolve(e.target.result); tx.onerror = e => reject(e.target.error); }); }
    function dbGetAll(storeName) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readonly'); tx.objectStore(storeName).getAll().onsuccess = e => resolve(e.target.result); tx.onerror = e => reject(e.target.error); }); }
    function dbPut(storeName, value) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).put(value); tx.oncomplete = resolve; tx.onerror = e => reject(e.target.error); }); }
    function dbDelete(storeName, key) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).delete(key); tx.oncomplete = resolve; tx.onerror = e => reject(e.target.error); }); }
    function dbClear(storeName) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).clear(); tx.oncomplete = resolve; tx.onerror = e => reject(e.target.error); }); }
    function invalidateCache() { AppState.cache = { prs: null, history: null, charts: {} }; }
    async function getHistory() {
        if (AppState.cache.history) return AppState.cache.history;
        try {
            const history = await dbGetAll(DB_CONFIG.STORES.SESSIONS);
            AppState.cache.history = history.sort((a, b) => b.rd.localeCompare(a.rd));
        } catch (e) {
            console.error(e);
            AppState.cache.history = [];
        }
        return AppState.cache.history;
    }

    function playSound(type, freq, duration, delay = 0) {
        if (!AppState.metronome.audioContext) return;
        if (AppState.metronome.audioContext.state === 'suspended') {
            AppState.metronome.audioContext.resume();
        }
        const o = AppState.metronome.audioContext.createOscillator();
        const g = AppState.metronome.audioContext.createGain();
        const now = AppState.metronome.audioContext.currentTime + delay;
        o.type = type;
        o.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        o.connect(g);
        g.connect(AppState.metronome.audioContext.destination);
        o.start(now);
        o.stop(now + duration);
    }

    function createSVGChart(containerId, datasets, options = {}) { const c = document.getElementById(containerId); if (!c) return; const W = c.clientWidth, H = c.clientHeight, P = 30, allPoints = datasets.flatMap(ds => ds.data); if (W === 0 || H === 0 || !allPoints.length || (allPoints.length < 2 && !options.allowSinglePoint)) { c.innerHTML = '<p style="text-align:center;color:var(--dim);margin-top:20%;">Not enough data.</p>'; return; } const maxVal = Math.max(...allPoints.map(d => d.value)), minVal = options.startAtZero ? 0 : Math.min(...allPoints.map(d => d.value)); const xR = W - P - P, yR = H - P - P, getX = i => P + (allPoints.length > 1 ? i * xR / (allPoints.length - 1) : xR / 2), getY = val => H - P - (maxVal === minVal ? yR / 2 : (val - minVal) * yR / (maxVal - minVal)); let svg = `<svg class="svg-chart-container" viewBox="0 0 ${W} ${H}" role="img"><title>${options.title||'Chart'}</title>`; for (let i = 0; i <= 4; i++) { const val = minVal + i * (maxVal - minVal) / 4, y = getY(val); svg += `<g><line class="grid" x1="${P}" y1="${y}" x2="${W-P}" y2="${y}"></line><text class="label" x="5" y="${y+4}">${Math.round(val)}</text></g>`; } datasets.forEach(ds => { const data = ds.data; if (!data.length) return; if (ds.type === 'line') { svg += `<polyline fill="none" stroke="${ds.color}" stroke-width="2" points="${data.map((d, i) => `${getX(i)},${getY(d.value)}`).join(' ')}"/>`; data.forEach((d, i) => { svg += `<g><circle cx="${getX(i)}" cy="${getY(d.value)}" r="3" fill="${ds.color}"/><text class="tooltip" text-anchor="middle" x="${getX(i)}" y="${getY(d.value)-8}" fill="${ds.color}">${d.value}</text></g>`; }); } else if (ds.type === 'bar') { const barW = Math.max(5, (xR / allPoints.length) * 0.8); data.forEach((d, i) => { const barH = Math.max(1, getY(minVal) - getY(d.value)); svg += `<g><rect x="${getX(i)-barW/2}" y="${getY(d.value)}" width="${barW}" height="${barH}" fill="${ds.color}"/><text class="tooltip" x="${getX(i)}" y="${getY(d.value)-5}" text-anchor="middle" fill="${ds.color}">${d.value}</text></g>`; }); } }); allPoints.forEach((d, i) => { if (allPoints.length < 15 || i % Math.floor(allPoints.length / 8) === 0) { svg += `<text class="label" text-anchor="middle" x="${getX(i)}" y="${H - 5}">${d.label}</text>`; } }); svg += '</svg>'; c.innerHTML = svg; }
    async function updateCharts() { Object.entries(AppState.config.colors).forEach(([k, v]) => { const el = document.getElementById(`leg-${k}`); if (el) el.style.color = v; }); const ex = DOMElements.chartExerciseSelect.value, h = await getHistory(), rollWin = parseInt(document.getElementById("rollAvgSel")?.value || "4"), cacheKey = `${ex}-${rollWin}`; if (AppState.cache.charts[cacheKey]) { const { orm, vol, total } = AppState.cache.charts[cacheKey]; createSVGChart('exC-orm', orm, { startAtZero: false, allowSinglePoint: true }); createSVGChart('exC-vol', vol, { startAtZero: true, allowSinglePoint: true }); createSVGChart('volC', total, { startAtZero: true, allowSinglePoint: true }); return; } const exData = h.map(s => { const l = s.logs.find(x => x.ex === ex); return l?.sets.length ? { d: s.rd, lbl: s.rd.substring(5), orm: Math.max(...l.sets.filter(i => i.status === 'completed').map(x => x.orm)), vol: l.sets.filter(i => i.status === 'completed').reduce((sm, x) => sm + (x.r * x.w), 0) } : null; }).filter(Boolean).sort((a, b) => a.d.localeCompare(b.d)); const totalData = h.map(s => { let v = s.logs.reduce((tv, l) => tv + l.sets.reduce((sv, set) => sv + (set.r * set.w), 0), 0); return { d: s.rd, lbl: s.rd.substring(5), v: v }; }).filter(s => s.v > 0).sort((a, b) => a.d.localeCompare(b.d)); const volPts = totalData.map(d => ({ value: d.v, label: d.lbl })); const rollPts = volPts.map((_, i, arr) => { const subset = arr.slice(Math.max(0, i - rollWin + 1), i + 1); return { value: Math.round(subset.reduce((s, c) => s + c.value, 0) / subset.length), label: arr[i].label }; }); const ormChartData = [{ type: 'line', color: AppState.config.colors.orm, data: exData.map(d => ({ value: d.orm, label: d.lbl })) }]; const volChartData = [{ type: 'bar', color: AppState.config.colors.exVol, data: exData.map(d => ({ value: d.vol, label: d.lbl })) }]; const totalChartData = [{ type: 'bar', color: AppState.config.colors.dayVol + '99', data: volPts }, { type: 'line', color: AppState.config.colors.rollAvg, data: rollPts }]; AppState.cache.charts[cacheKey] = { orm: ormChartData, vol: volChartData, total: totalChartData }; createSVGChart('exC-orm', ormChartData, { startAtZero: false, allowSinglePoint: true }); createSVGChart('exC-vol', volChartData, { startAtZero: true, allowSinglePoint: true }); createSVGChart('volC', totalChartData, { startAtZero: true, allowSinglePoint: true }); }
    async function exportData() { const h = await getHistory(); let csvContent = "date,exercise,reps,weight\n"; h.sort((a, b) => a.rd.localeCompare(b.rd)).forEach(s => { s.logs.forEach(l => { const escapedEx = `"${l.ex.replace(/"/g, '""')}"`; l.sets.forEach(st => { if (st.status === 'completed') { csvContent += `${s.rd},${escapedEx},${st.r},${st.w}\n`; } }); }); }); const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "fitness_log_sets.csv"; link.click(); URL.revokeObjectURL(link.href); }
    function parseCSVLine(line) { const regex = /(?:"((?:[^"]|"")*)"|([^,"]*))(?:,|$)/g; let fields = [], match; while (match = regex.exec(line)) { fields.push(match[1] ? match[1].replace(/""/g, '"') : (match[2] || '')); if (match[0].slice(-1) !== ',') break; } return fields; }
    async function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                const lines = ev.target.result.split("\n");
                const headersLine = lines.shift().trim().toLowerCase();
                if (headersLine !== 'date,exercise,reps,weight') {
                    throw new Error('Invalid CSV format. Expected headers: date,exercise,reps,weight');
                }
                const existingDates = new Set((await getHistory()).map(s => s.rd));
                const sessionsObj = {};
                for (const line of lines) {
                    if (!line.trim()) continue;
                    const p = parseCSVLine(line);
                    const entry = { date: p[0], exercise: p[1], reps: p[2], weight: p[3] };
                    if (!entry.date || !/^\d{4}-\d{2}-\d{2}$/.test(entry.date) || !entry.exercise || entry.reps === undefined || entry.weight === undefined) {
                        continue;
                    }
                    const reps = parseInt(entry.reps, 10);
                    const weight = parseFloat(entry.weight);
                    if (isNaN(reps) || isNaN(weight)) {
                        continue;
                    }
                    const key = entry.date;
                    if (!sessionsObj[key]) {
                        sessionsObj[key] = { rd: key, day: "Imported Session", logs: [], warmups: [], cooldowns: [] };
                    }
                    const originalExerciseName = entry.exercise.trim();
                    let log = sessionsObj[key].logs.find(l => l.ex.trim().toLowerCase() === originalExerciseName.toLowerCase());
                    if (!log) {
                        log = { ex: originalExerciseName, sets: [] };
                        sessionsObj[key].logs.push(log);
                    }
                    log.sets.push({
                        r: reps,
                        w: weight,
                        orm: Math.round(weight * (1 + reps / 30)),
                        status: 'completed',
                        amrap: false
                    });
                }
                const sessionsToImport = Object.values(sessionsObj).filter(s => !existingDates.has(s.rd));
                const skippedSessions = Object.keys(sessionsObj).length - sessionsToImport.length;
                if (sessionsToImport.length > 0) {
                    const tx = AppState.db.transaction(DB_CONFIG.STORES.SESSIONS, 'readwrite');
                    sessionsToImport.forEach(s => tx.objectStore(DB_CONFIG.STORES.SESSIONS).put(s));
                    await new Promise(res => tx.oncomplete = res);
                }
                invalidateCache();
                showToast(`Import done. ${sessionsToImport.length} new sessions imported. ${skippedSessions} sessions were skipped as dates already exist.`, 5000);
                await init();
            } catch (error) {
                console.error(error);
                showToast(`Import failed: ${error.message}`, 5000);
            } finally {
                e.target.value = '';
            }
        };
        reader.readAsText(file);
    }
