<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Log</title>
    <style>
        :root{--bg:#121212;--card:#1e1e1e;--inp:#2a2a2a;--txt:#e0e0e0;--dim:#b0b0b0;--blu:#3498db;--grn:#2ecc71;--red:#ff4d4d;--pur:#9b59b6;--brd:#333;--gold: #FFD700;}
        body{font-family:sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:20px;}
        .container{max-width:600px;margin:auto;background:var(--card);padding:20px;border-radius:12px;border:1px solid var(--brd);}
        h1,h2,h3{color:#fff;text-align:center;margin-top:0;}
        select,button,input,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid var(--brd);background:var(--inp);color:#fff;font-size:14px;box-sizing:border-box;}
        button{background:var(--blu);border:none;cursor:pointer;font-weight:bold;}
        button:disabled{background:#555;cursor:not-allowed;opacity:0.6;}
        .timer-card{position:sticky;top:10px;z-index:100;max-width:600px;margin:auto;display:flex;justify-content:space-between;align-items:center;background:#121212;padding:5px 10px;border-radius:8px;margin-bottom:20px;flex-wrap: wrap; justify-content: center; gap: 15px;}
        #timeDisplay{font-size:1.8em;font-weight:bold;font-family:monospace;margin:0; color: var(--gold);}
        .timer-controls{display:flex;gap:8px;}
        .timer-controls button, #metronomeToggleBtn {min-width:44px;min-height:44px;padding:4px 8px;font-size:14px;margin:0; background-color:#121212; color:var(--gold); border:1px solid var(--gold);}
        .flex-row{display:flex;gap:10px;justify-content:center;align-items:center;}
        .flex-row button,.flex-row select,.flex-row input{margin-top:0;margin-bottom:0;}
        #date{width:150px;}
        #daySel{flex-grow:1;}
        .flex-row button{width:auto;padding:8px 15px;}
        .section-card{background:var(--card);padding:15px;border:1px solid var(--brd);border-radius:8px;margin-bottom:20px;}
        .routine-box{padding:12px;border-radius:6px;margin:10px 0;text-align:left;display:flex;flex-direction:column;}
        .box-w{background:rgba(255,77,77,0.08);border-left:4px solid var(--red);}
        .box-c{background:rgba(52,152,219,0.08);border-left:4px solid var(--blu);}
        .chk-item, .set-row {display:flex;align-items:center;gap:6px;margin-bottom:8px;}
        .set-row {flex-wrap: nowrap;}
        .chk-item > span, .set-row-main {flex-grow:1; display:flex; align-items:center; gap:6px;}
        .check-actions {display:flex; gap: 4px; flex-shrink: 0;}
        .btn-act{min-width:38px;min-height:38px;padding:4px 6px;font-size:14px;border-radius:4px;background:#333;color:#888;border:1px solid #444;}
        .btn-comp.active{background:var(--grn);color:#000;border-color:var(--grn);}
        .btn-skip.active{background:var(--red);color:#fff;border-color:var(--red);}
        .txt-comp{text-decoration:line-through;color:var(--grn);}
        .txt-skip{text-decoration:line-through;color:var(--red);opacity:0.5;}
        .ex-block{background:rgba(155,89,182,0.05);padding:12px;margin-bottom:15px;border-radius:6px;border-left:5px solid var(--pur);}
        .set-row input{width:50px;background:#333;text-align:center;font-weight:bold;padding:8px 4px;}
        .set-row .weight-input{width:75px;}
        .orm-header-badge{font-size:12px;color:var(--gold);font-weight:bold;margin-left:8px;}
        .history-card{background:#252525;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #333;}
        .chart-container{height:240px;width:100%;position:relative;margin-top:15px;overflow:hidden;}
        .svg-chart-container { display: block; width: 100%; background: #252525; border-radius: 4px; }
        .svg-chart-container .label { fill: var(--dim); font-size: 10px; }
        .svg-chart-container .grid { stroke: var(--brd); stroke-dasharray: 2,2; }
        .svg-chart-container .tooltip { display: none; }
        .svg-chart-container circle:hover + .tooltip, .svg-chart-container rect:hover + .tooltip { display: block; }
        table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
        th,td{border:1px solid var(--brd);padding:6px;text-align:left;}
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; justify-content:center; align-items:center; }
        .modal-content { background:var(--card); padding:20px 25px; border-radius:12px; max-width:90%; width:360px; border:1px solid var(--brd); position:relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height:85vh; overflow-y:auto; }
        .close-btn { position:absolute; top:8px; right:8px; width:40px; height:40px; margin:0; background:transparent; border:none; color:var(--dim); font-size:20px; cursor:pointer; display:flex; justify-content:center; align-items:center; padding:0; line-height:1; border-radius:50%; z-index:10; }
        .close-btn:hover, .close-btn:active { background:rgba(255,255,255,0.1); color:#fff; }
        .hidden{display:none !important;}
        .modal-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .badge { font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .badge-pri { background: rgba(255,77,77,0.15); color: var(--red); border: 1px solid var(--red); }
        .badge-sec { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid var(--gold); }
        .modal-section { margin-bottom: 12px; }
        .modal-section h4 { color: #fff; margin: 0 0 4px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .modal-section p { font-size: 13px; margin: 0; color: var(--dim); line-height: 1.4; }
        .error-border { border: 1px solid var(--red) !important; }
        #toast-notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #333; color: white; padding: 15px 25px; border-radius: 8px; z-index: 10000; font-size: 16px; font-weight: bold; opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s; }
        #toast-notification.show { opacity: 1; visibility: visible; }
        #calendar-container { padding: 10px; background: #252525; border-radius: 8px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-header button { width: 44px; height: 44px; margin: 0; padding: 0; background: #333; font-size: 18px; }
        #calendar-month-year { font-size: 1.2em; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day, .calendar-weekday { display: flex; justify-content: center; align-items: center; height: 38px; border-radius: 50%; }
        .calendar-weekday { font-size: 0.8em; font-weight: bold; color: var(--dim); }
        .calendar-day { cursor: pointer; position: relative; font-size: 0.9em; }
        .calendar-day:hover { background: #444; }
        .calendar-day.other-month { color: #555; cursor: default; }
        .calendar-day.other-month:hover { background: transparent; }
        .calendar-day.today { font-weight: bold; border: 1px solid var(--blu); }
        .calendar-day.selected { background: var(--blu); color: #fff; }
        .calendar-day .workout-dot { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; background: var(--pur); border-radius: 50%; }
        .setup-block { margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; }
        .setup-block h4 { margin-top:0; margin-bottom:10px; font-size:14px; color:#fff; }
    </style>
    <link rel="manifest" id="manifest-link">
    <meta name="theme-color" content="#1e1e1e">
    <script>
        const manifest = {
            "name": "Fitness Log",
            "short_name": "FitnessLog",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#121212",
            "theme_color": "#1e1e1e",
            "description": "A single-file progressive web app for tracking workouts.",
            "icons": [
                { "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='85' font-size='80'%3E🏋️%3C/text%3E%3C/svg%3E", "sizes": "any", "type": "image/svg+xml" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.getElementById('manifest-link').href = manifestUrl;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swContent = `
                    const CACHE_NAME = 'fitness-log-cache-v1';
                    const urlsToCache = ['.'];
                    self.addEventListener('install', event => {
                        self.skipWaiting(); 
                        event.waitUntil(
                            caches.open(CACHE_NAME).then(cache => {
                                console.log('Opened cache');
                                return cache.addAll(urlsToCache);
                            })
                        );
                    });
                    self.addEventListener('fetch', event => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            caches.match(event.request).then(response => {
                                if (response) {
                                    return response;
                                }
                                return fetch(event.request);
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swContent], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl)
                    .then(registration => console.log('ServiceWorker registration successful with scope: ', registration.scope))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</head>
<body>
<div id="exModal" class="modal-overlay hidden" data-action="closeModal">
    <div class="modal-content">
        <button class="close-btn" aria-label="Close Modal" data-action="closeModal">✕</button>
        <h2 id="modalTitle" style="margin-top:0; color:var(--blu); text-align:left; padding-right:35px; font-size:20px; margin-bottom:10px;">🏋️ Exercise</h2>
        <div id="modalBadges" class="modal-badges"></div>
        <div class="modal-section"><h4>📐 Setup</h4><p id="modalSetup"></p></div>
        <div class="modal-section"><h4>⚙️ Execution</h4><p id="modalExec"></p></div>
        <div class="modal-section"><h4>⚠️ Mistakes to Avoid</h4><p id="modalMistakes"></p></div>
        <button data-action="jumpToProgress" style="width:100%; margin-top:15px; padding:12px; border-radius:8px; font-size:15px; background:var(--blu); color:#fff; font-weight:bold;">📈 View Progress Chart</button>
    </div>
</div>
<div class="timer-card">
    <div class="flex-row">
        <div id="timeDisplay">00:00</div>
        <div class="timer-controls">
            <button data-action="addTime" data-time="60">+1m</button>
            <button data-action="resetTimer">Reset</button>
        </div>
    </div>
    <div class="flex-row" style="border-left: 1px solid var(--brd); padding-left: 15px;">
        <button id="metronomeToggleBtn" data-action="toggleMetronome">🎵</button>
        <span id="bpmDisplay" style="font-size: 14px; font-family: monospace; color: var(--gold);">60 BPM</span>
    </div>
</div>
<div class="container">
    <h1>🏋️ Fitness Log</h1>
    <div class="section-card">
        <div id="editMode" class="hidden" style="color:var(--gold);text-align:center;padding:10px;">⚠️ EDIT MODE <button data-action="cancelEdit" style="background:none;color:var(--gold);border:none;">Cancel</button></div>
        <div class="flex-row" style="margin-bottom:8px;">
            <input type="date" id="date">
            <select id="daySel" data-action="loadDay"></select>
        </div>
        <div id="wBox" class="routine-box box-w"></div>
        <div id="form"></div>
        <div id="cBox" class="routine-box box-c"></div>
        <button id="saveSessionBtn" data-action="saveWorkoutSession" style="background:#27ae60;color:#f0f0f0;min-height:44px;">Save Session</button>
    </div>
    <div class="section-card">
        <h3 id="progressSection">📈 Progress</h3>
        <select id="cxSel" data-action="updateCharts"></select>
        <div style="font-size:12px; color:var(--dim); text-align:center; margin-top:10px;">
            <span id="leg-orm" style="color:var(--gold);">●</span> Est. 1RM (Strength) &nbsp;&nbsp;&nbsp; <span id="leg-exVol" style="color:#009688;">■</span> Total Volume (Workload)
        </div>
        <div class="chart-container" id="exC-orm" style="height:150px; margin-top:10px;"></div>
        <div class="chart-container" id="exC-vol" style="height:150px; margin-top:10px;"></div>
    </div>
    <div class="section-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">📊 Volume</h3>
            <select id="rollAvgSel" data-action="updateCharts" style="width:auto; padding:4px 8px; margin:0; font-size:12px; background:#333;">
                <option value="2">2-Session</option>
                <option value="4" selected>4-Session</option>
                <option value="8">8-Session</option>
                <option value="16">16-Session</option>
            </select>
        </div>
        <div style="font-size:12px; color:var(--dim); text-align:center; margin-top:10px;">
            <span id="leg-dayVol" style="color:#FF7F50;">■</span> Daily Volume &nbsp;&nbsp;&nbsp; <span id="leg-rollAvg" style="color:var(--gold);">●</span> Rolling Avg
        </div>
        <div class="chart-container" id="volC"></div>
    </div>
    <div class="section-card"><h3>🏆 PRs</h3><div id="pb"></div></div>
    <h2>📜 History</h2>
    <div id="calendar-container">
        <div class="calendar-header">
            <button data-action="prevMonth">‹</button>
            <div id="calendar-month-year"></div>
            <button data-action="nextMonth">›</button>
        </div>
        <div class="calendar-grid" id="calendar-weekdays"></div>
        <div class="calendar-grid" id="calendar-days"></div>
    </div>
    <div id="hist-detail"></div>
    <div class="section-card" style="margin-top: 20px;">
        <h3 data-action="toggleSetup" style="cursor:pointer;padding:10px 0;">⚙️ Setup (Click to Expand)</h3>
        <div id="setup" class="hidden">
            <div class="setup-block">
                <h4>General</h4>
                <label style="font-size:12px; display:flex; align-items:center; gap:10px; color:var(--dim);">
                    Metronome BPM:
                    <input type="number" id="setup-bpm" style="width:80px; padding:4px 8px; margin:0;" min="40" max="200">
                </label>
            </div>
            <div class="setup-block">
                <h4>🎨 Chart Colors</h4>
                <div class="flex-row" style="flex-wrap: wrap; gap: 15px; justify-content: flex-start;">
                    <label style="font-size:12px; display:flex; align-items:center; gap:5px; color:var(--dim);">1RM <input type="color" id="c-orm" style="width:25px; height:25px; padding:0; border:none;"></label>
                    <label style="font-size:12px; display:flex; align-items:center; gap:5px; color:var(--dim);">Ex. Vol <input type="color" id="c-exVol" style="width:25px; height:25px; padding:0; border:none;"></label>
                    <label style="font-size:12px; display:flex; align-items:center; gap:5px; color:var(--dim);">Daily Vol <input type="color" id="c-dayVol" style="width:25px; height:25px; padding:0; border:none;"></label>
                    <label style="font-size:12px; display:flex; align-items:center; gap:5px; color:var(--dim);">Roll Avg <input type="color" id="c-rollAvg" style="width:25px; height:25px; padding:0; border:none;"></label>
                </div>
            </div>
            <div id="setupInputs"></div>
            <button data-action="addDayToSetup" style="background:#333; min-height:44px; margin-top:10px;">+ Add New Day</button>
            <button data-action="saveSetup" style="background:var(--pur);min-height:44px;margin-top:10px;">Save Configuration</button>
            <button data-action="resetSetup" style="background:var(--red);margin-top:10px;min-height:44px;">Factory Reset</button>
        </div>
    </div>
    <div class="flex-row" style="margin-top:20px;">
        <button id="exportBtn" data-action="exportData" style="background:#444;min-height:44px;">📤 Export</button>
        <button id="importBtn" data-action="triggerImport" style="background:#444;min-height:44px;">📥 Import</button>
        <input type="file" id="imp" class="hidden" data-action="importData">
    </div>
</div>
<div id="toast-notification"></div>
<script>

    const exerciseInfo = { "Incline Press": { icon:"🏋️", pri:["Upper Chest"], sec:["Front Delts", "Triceps"], setup:"Set bench to 30-45°. Plant feet firmly. Grip slightly wider than shoulders.", exec:"Lower weight to upper chest under control. Press up and slightly back over eyes.", mistakes:"Bouncing weight off chest. Flaring elbows straight out. Lifting glutes off seat." }, "Incline Fly": { icon:"🪢", pri:["Upper Chest"], sec:["Front Delts"], setup:"Set bench to 30-45°. Hold dumbbells or cables with a neutral grip.", exec:"Keep a slight bend in elbows. Open arms wide like hugging a barrel. Squeeze chest to bring hands together.", mistakes:"Bending elbows too much (turns into a press). Going too deep and straining shoulders." }, "Front Raise": { icon:"💪", pri:["Front Delts"], sec:["Core"], setup:"Stand tall holding dumbbells or cable handle. Keep a slight elbow bend.", exec:"Raise weight directly in front of you to shoulder height. Lower slowly.", mistakes:"Using momentum/swinging torso. Raising weight too high above head." }, "Triceps Pushdown": { icon:"🪢", pri:["Triceps"], sec:["Core"], setup:"Attach rope or bar to high cable. Hinge slightly forward at hips. Pin elbows to sides.", exec:"Push weight straight down until arms are fully extended. Squeeze triceps. Return to chest height.", mistakes:"Letting elbows flare or travel forward. Using bodyweight to press down." }, "Overhead Triceps Extension": { icon:"💪", pri:["Triceps"], sec:["Core"], setup:"Sit or stand tall holding one dumbbell with both hands over your head. Can also use a cable rope.", exec:"Lower the weight behind your head by bending your elbows. Extend arms fully to lift the weight back up. Keep upper arms stationary.", mistakes:"Flaring elbows out to the sides. Arching the lower back excessively. Using momentum." }, "Side Lunge": { icon:"🦵", pri:["Quads", "Glutes"], sec:["Adductors"], setup:"Stand with feet wide. Toes pointed slightly out. Keep chest up.", exec:"Push hips back and bend one knee, keep     function openDB() { return new Promise((resolve, reject) => { const request = indexedDB.open(constants.DB_NAME, constants.DB_VERSION); request.onerror = e => reject(new Error("DB Error: " + e.target.errorCode)); request.onsuccess = e => resolve(e.target.result); request.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'rd' }); if (!db.objectStoreNames.contains('config')) db.createObjectStore('config', { keyPath: 'id' }); }; }); }
    function dbGet(storeName, key) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readonly'); tx.objectStore(storeName).get(key).onsuccess = e => resolve(e.target.result); tx.onerror = e => reject(e.target.error); }); }
    function dbGetAll(storeName) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readonly'); tx.objectStore(storeName).getAll().onsuccess = e => resolve(e.target.result); tx.onerror = e => reject(e.target.error); }); }
    function dbPut(storeName, value) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).put(value); tx.oncomplete = resolve; tx.onerror = e => reject(e.target.error); }); }
    function dbDelete(storeName, key) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).delete(key); tx.oncomplete = resolve; tx.onerror = e => reject(e.target.error); }); }
    function dbClear(storeName) { return new Promise((resolve, reject) => { const tx = AppState.db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).clear(); tx.oncomplete = resolve; tx.onerror = e => reject(e.target.error); }); }
    function invalidateCache() { AppState.cachedPRs = null; AppState.cachedHistory = null; AppState.cachedChartData = {}; }
    async function getHistory() { if (AppState.cachedHistory) return AppState.cachedHistory; try { AppState.cachedHistory = (await dbGetAll('sessions')).sort((a,b)=> b.rd.localeCompare(a.rd)); } catch (e) { console.error("Could not fetch history:", e); AppState.cachedHistory = []; } return AppState.cachedHistory; }
    async function migrateDataStructures(config) {
        if (config && config.plan && !Array.isArray(config.plan)) {
            console.log("Migrating config data structure from object to array...");
            try {
                const newPlan = Object.entries(config.plan).map(([name, exercises]) => ({ name, exercises }));
                const newWarmups = Object.entries(config.warmups || {}).map(([name, items]) => ({ name, items }));
                const newCooldowns = Object.entries(config.cooldowns || {}).map(([name, items]) => ({ name, items }));
                config.plan = newPlan;
                config.warmups = newWarmups;
                config.cooldowns = newCooldowns;
                await dbPut('config', config);
                console.log("Data structure migration successful.");
                return config;
            } catch (error) {
                console.error("Failed to migrate data structures:", error);
                showToast("Error migrating data.", 5000);
                return config;
            }
        }
        return config;
    }
    async function loadConfig() {
        let storedConfig = await dbGet('config', 'appConfig');
        if(storedConfig) storedConfig = await migrateDataStructures(storedConfig);
        if (storedConfig) {
            AppState.appConfig = storedConfig;
            if(!AppState.appConfig.colors) AppState.appConfig.colors = { ...defaultColors };
            if(!AppState.appConfig.bpm) AppState.appConfig.bpm = constants.DEFAULT_BPM;
        } else {
            console.log("Setting up default config...");
            AppState.appConfig = { id: 'appConfig', plan: defaultPlan, warmups: Object.entries(defaultWarmups).map(([name, items])=>({name, items})), cooldowns: Object.entries(defaultCooldowns).map(([name, items])=>({name, items})), colors: { ...defaultColors }, bpm: constants.DEFAULT_BPM };
            await dbPut('config', AppState.appConfig);
        }
    }
    async function saveSettings() { await dbPut('config', AppState.appConfig); invalidateCache(); }
    async function resetSetup() { if(confirm("Reset to factory defaults? All custom plans AND workout history will be lost.")) { try { await Promise.all([dbClear('sessions'), dbClear('config')]); location.reload(); } catch (error) { console.error("Factory reset failed:", error); showToast("Error during reset.", 5000); } } }
    function showExerciseInfo(exName) { const info = exerciseInfo[exName] || fallbackEx; const modal = document.getElementById('exModal'); modal.querySelector('#modalTitle').innerText = `${info.icon} ${exName}`; modal.querySelector('#modalBadges').innerHTML = info.pri.map(m => `<span class="badge badge-pri">${m}</span>`).join('') + info.sec.map(m => `<span class="badge badge-sec">${m}</span>`).join(''); modal.querySelector('#modalSetup').innerText = info.setup; modal.querySelector('#modalExec').innerText = info.exec; modal.querySelector('#modalMistakes').innerText = info.mistakes; modal.dataset.currentEx = exName; modal.classList.remove('hidden'); }

    function addDayToSetup() { const setupInputs = document.getElementById("setupInputs"); const id = `setup-day-${setupInputs.children.length}`, newBlock = document.createElement('div'); newBlock.className = 'ex-block'; newBlock.id = id; newBlock.innerHTML = `<input data-id="${id}" class="setup-label" placeholder="New Day Name"><textarea data-id="${id}" class="setup-warmup" placeholder="Warmup"></textarea><textarea data-id="${id}" class="setup-exercises" placeholder="Exercise | Sets | Reps | Lbs | (Optional) Default 1RM"></textarea><textarea data-id="${id}" class="setup-cooldown" placeholder="Cooldown"></textarea>`; setupInputs.appendChild(newBlock); newBlock.querySelector('input').focus(); }
    async function init(){
        try {
            AppState.db = await openDB();
            AppState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            await loadConfig();
            const sel = document.getElementById("daySel"), cSel = document.getElementById("cxSel");
            sel.innerHTML = AppState.appConfig.plan.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
            cSel.innerHTML = [...new Set((await getHistory()).flatMap(s => s.logs.map(l => l.ex)))].sort().map(ex => `<option value="${ex}">${ex}</option>`).join('');
            Object.entries(AppState.appConfig.colors).forEach(([key, val]) => document.getElementById(`c-${key}`).value = val);
            document.getElementById('setup-bpm').value = AppState.appConfig.bpm;
            document.getElementById('bpmDisplay').textContent = `${AppState.appConfig.bpm} BPM`;
            document.getElementById('calendar-weekdays').innerHTML = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="calendar-weekday">${d}</div>`).join('');
            renderSetupInputs();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            const timerEndTime = localStorage.getItem('timerEndTime');
            if (timerEndTime) { const rem = Math.round((timerEndTime - Date.now()) / 1000); if (rem > 0) { AppState.timeRemaining = rem; startCountdown(); } else { localStorage.removeItem('timerEndTime'); } updateTimerDisplay(); }
            await Promise.all([loadDay(), renderCalendar(), updateCharts(), renderPRs()]);
        } catch (error) { console.error("Initialization failed:", error); document.body.innerHTML = `<div style="color:red;padding:20px;"><h1>Fatal Error</h1><p>Application could not start. Check browser settings (IndexedDB might be blocked).</p><p><strong>Error:</strong> ${error.message}</p></div>`; }

    function parseCSVLine(line) { const regex = /(?:"((?:[^"]|"")*)"|([^,"]*))(?:,|$)/g; let fields = [], match; while (match = regex.exec(line)) { fields.push(match[1] ? match[1].replace(/""/g, '"') : (match[2] || '')); if (match[0].slice(-1) !== ',') break; } return fields; }
